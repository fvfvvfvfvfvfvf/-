<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Погода</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 40px auto; text-align: center; }
        input { padding: 8px; width: 60%; }
        button { padding: 8px 16px; }
        .card { background: #f4f4f4; padding: 20px; border-radius: 12px; margin-top: 20px; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>🌤️ Погода</h1>
    <form method="post">
        <input type="text" name="city" placeholder="Например, Moscow" required>
        <button type="submit">Узнать</button>
    </form>

    {% if weather %}
        <div class="card">
            {% if weather.error %}
                <p class="error">❌ {{ weather.error }}</p>
            {% else %}
                <h2>🌍 {{ weather.city }}</h2>
                <p>🌡️ {{ weather.temp }}°C</p>
                <p>🤔 Ощущается как: {{ weather.feels_like }}°C</p>
                <p>☁️ {{ weather.description }}</p>
            {% endif %}
        </div>
    {% endif %}
</body>
</html>
